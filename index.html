<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miraculous Clash - Fighting Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0d0e14 100%);
      font-family: 'Arial', sans-serif;
      color: white;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-container {
      position: relative;
      width: 95vw;
      max-width: 1400px;
      height: 90vh;
      max-height: 800px;
      background: linear-gradient(180deg, #1a2847 0%, #0f1419 50%, #0a0c10 100%);
      border: 3px solid #4a90e2;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(74, 144, 226, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* Background */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .sky {
      position: absolute;
      top: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(180deg, #2d5a8c 0%, #1a3a5c 50%, #0d1f3c 100%);
    }

    .city-silhouette {
      position: absolute;
      bottom: 25%;
      width: 100%;
      height: 30%;
      opacity: 0.4;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300"><defs><linearGradient id="cityGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:rgba(0,0,0,0);stop-opacity:1" /><stop offset="100%" style="stop-color:rgba(0,0,0,0.8);stop-opacity:1" /></linearGradient></defs><rect fill="url(%23cityGrad)" width="1400" height="300"/><polygon points="0,280 50,180 100,200 150,120 200,150 250,100 300,180 350,140 400,200 450,160 500,210 550,150 600,190 650,130 700,170 750,140 800,180 850,150 900,200 950,160 1000,190 1050,140 1100,180 1150,150 1200,210 1250,160 1300,190 1350,140 1400,180 1400,300 0,300" fill="rgba(10,15,30,0.9)"/><rect x="20" y="240" width="20" height="30" fill="rgba(255,200,100,0.4)"/><rect x="60" y="250" width="15" height="20" fill="rgba(255,200,100,0.3)"/><rect x="100" y="245" width="18" height="25" fill="rgba(255,200,100,0.35)"/></svg>') repeat-x;
      background-size: 1400px 300px;
    }

    .ground-layer {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 25%;
      background: linear-gradient(180deg, rgba(15, 20, 35, 0.6) 0%, #050607 100%);
      border-top: 2px solid rgba(255, 255, 255, 0.1);
    }

    .ground-texture {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 40px,
        rgba(255, 255, 255, 0.03) 40px,
        rgba(255, 255, 255, 0.03) 80px
      );
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 30px;
      z-index: 100;
      pointer-events: none;
    }

    .player-hud {
      flex: 0 0 35%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-hud.right {
      align-items: flex-end;
      text-align: right;
    }

    .player-name {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .ladybug-name {
      color: #ff4460;
      text-shadow: 0 0 15px rgba(255, 68, 96, 0.6);
    }

    .villain-name {
      color: #6dd5ff;
      text-shadow: 0 0 15px rgba(109, 213, 255, 0.6);
    }

    .health-bar-container {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .health-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      width: 100%;
      transition: width 0.2s ease;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    }

    .health-bar.villain {
      background: linear-gradient(90deg, #60a5fa, #3b82f6);
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.6);
    }

    .timer-display {
      flex: 0 0 auto;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid rgba(255, 200, 0, 0.5);
      border-radius: 10px;
      color: #ffc800;
      text-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 200, 0, 0.3);
    }

    .info-text {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.8;
    }

    /* Game Area */
    .game-area {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .fighters-container {
      position: absolute;
      inset: 0;
    }

    .fighter {
      position: absolute;
      bottom: 80px;
      width: 200px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .fighter.p1 {
      left: 5%;
    }

    .fighter.p2 {
      right: 5%;
      transform: scaleX(-1);
    }

    .fighter-sprite {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Ladybug Realistic Design */
    .ladybug-body {
      position: absolute;
      width: 160px;
      height: 220px;
      left: 20px;
      top: 40px;
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 50%, #ff6e40 100%);
      border-radius: 60% 60% 50% 50% / 50% 50% 45% 45%;
      box-shadow: inset -5px -10px 20px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(255, 23, 68, 0.4);
    }

    .ladybug-spot {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.15));
      border-radius: 50%;
    }

    .ladybug-spot-large {
      width: 50px;
      height: 50px;
    }

    .ladybug-spot-medium {
      width: 35px;
      height: 35px;
    }

    .ladybug-spot-small {
      width: 25px;
      height: 25px;
    }

    .spot-1 { left: 20px; top: 50px; }
    .spot-2 { right: 20px; top: 50px; }
    .spot-3 { left: 35px; top: 110px; }
    .spot-4 { right: 35px; top: 110px; }
    .spot-5 { left: 55px; top: 160px; }
    .spot-6 { right: 55px; top: 160px; }

    .ladybug-head {
      position: absolute;
      width: 90px;
      height: 100px;
      top: -30px;
      left: 35px;
      background: linear-gradient(135deg, #ff6b5b 0%, #ff4757 50%, #ff3838 100%);
      border-radius: 50%;
      box-shadow: inset -3px -8px 15px rgba(0, 0, 0, 0.25), 0 5px 15px rgba(255, 23, 68, 0.3);
      z-index: 5;
    }

    .ladybug-ear {
      position: absolute;
      width: 35px;
      height: 45px;
      background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
      border-radius: 50% 50% 45% 55%;
      top: -15px;
      z-index: 4;
    }

    .ladybug-ear-left {
      left: 10px;
      transform: rotate(-20deg);
    }

    .ladybug-ear-right {
      right: 10px;
      transform: rotate(20deg);
    }

    .ladybug-eye {
      position: absolute;
      width: 16px;
      height: 20px;
      background: #1a1a2e;
      border-radius: 50%;
      top: 35px;
      z-index: 6;
      box-shadow: inset -2px -2px 5px rgba(0, 0, 0, 0.6);
    }

    .ladybug-eye-left {
      left: 25px;
    }

    .ladybug-eye-right {
      right: 25px;
    }

    .ladybug-eye::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 8px;
      background: white;
      border-radius: 50%;
      top: 4px;
      left: 4px;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    .ladybug-mouth {
      position: absolute;
      width: 30px;
      height: 15px;
      border: 2px solid #1a1a2e;
      border-radius: 0 0 30px 30px;
      border-top: none;
      top: 60px;
      left: 30px;
      z-index: 6;
    }

    .ladybug-mask {
      position: absolute;
      width: 70px;
      height: 25px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.1));
      top: 38px;
      left: 10px;
      border-radius: 50%;
      z-index: 7;
      opacity: 0.6;
    }

    .ladybug-arm {
      position: absolute;
      width: 40px;
      height: 100px;
      background: linear-gradient(90deg, #ffb3ba 0%, #ffc0cb 100%);
      border-radius: 20px;
      top: 60px;
      box-shadow: inset -2px -5px 10px rgba(0, 0, 0, 0.15), 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .ladybug-arm-left {
      left: -35px;
      transform: rotate(-20deg);
      transform-origin: top right;
    }

    .ladybug-arm-right {
      right: -35px;
      transform: rotate(20deg);
      transform-origin: top left;
    }

    .ladybug-glove {
      position: absolute;
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 100%);
      border-radius: 50%;
      bottom: 0;
      left: 2px;
      box-shadow: inset -2px -3px 8px rgba(0, 0, 0, 0.2), 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .ladybug-leg {
      position: absolute;
      width: 38px;
      height: 120px;
      background: linear-gradient(90deg, #4a5568 0%, #2d3748 100%);
      border-radius: 20px;
      bottom: -120px;
      box-shadow: inset -2px -5px 12px rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .ladybug-leg-left {
      left: 35px;
    }

    .ladybug-leg-right {
      right: 35px;
    }

    .ladybug-shoe {
      position: absolute;
      width: 40px;
      height: 25px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
      border-radius: 5px 5px 20px 20px;
      bottom: -25px;
      left: -1px;
      box-shadow: inset -1px -2px 5px rgba(0, 0, 0, 0.5), 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    /* Villain (Akumatized) Design */
    .villain-body {
      position: absolute;
      width: 160px;
      height: 220px;
      left: 20px;
      top: 40px;
      background: linear-gradient(135deg, #3d3d5c 0%, #2d2d4a 50%, #1a1a2e 100%);
      border-radius: 50% 50% 45% 50% / 52% 50% 48% 45%;
      box-shadow: inset -5px -10px 20px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(61, 61, 92, 0.4), inset 0 0 30px rgba(109, 213, 255, 0.15);
    }

    .villain-accent {
      position: absolute;
      background: linear-gradient(135deg, rgba(109, 213, 255, 0.4), rgba(59, 130, 246, 0.2));
      border-radius: 50%;
    }

    .villain-accent-1 {
      width: 45px;
      height: 45px;
      left: 25px;
      top: 60px;
    }

    .villain-accent-2 {
      width: 45px;
      height: 45px;
      right: 25px;
      top: 60px;
    }

    .villain-accent-3 {
      width: 60px;
      height: 50px;
      left: 50px;
      top: 140px;
    }

    .villain-head {
      position: absolute;
      width: 90px;
      height: 100px;
      top: -30px;
      left: 35px;
      background: linear-gradient(135deg, #4a5f8f 0%, #3d4d7a 50%, #2d3d5a 100%);
      border-radius: 50%;
      box-shadow: inset -3px -8px 15px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(109, 213, 255, 0.2);
      z-index: 5;
    }

    .villain-eye {
      position: absolute;
      width: 18px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #6dd5ff, #3b82f6);
      border-radius: 50%;
      top: 33px;
      z-index: 6;
      box-shadow: 0 0 8px rgba(109, 213, 255, 0.8), inset -1px -2px 5px rgba(0, 0, 0, 0.4);
    }

    .villain-eye-left {
      left: 24px;
    }

    .villain-eye-right {
      right: 24px;
    }

    .villain-pupil {
      position: absolute;
      width: 8px;
      height: 12px;
      background: #1a1a2e;
      border-radius: 50%;
      top: 6px;
      left: 5px;
    }

    .villain-horn {
      position: absolute;
      width: 25px;
      height: 50px;
      background: linear-gradient(135deg, #6dd5ff 0%, #3b82f6 100%);
      top: -25px;
      z-index: 4;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      box-shadow: 0 0 10px rgba(109, 213, 255, 0.6);
    }

    .villain-horn-left {
      left: 5px;
      transform: rotate(-20deg);
    }

    .villain-horn-right {
      right: 5px;
      transform: rotate(20deg);
    }

    .villain-mouth {
      position: absolute;
      width: 28px;
      height: 12px;
      border: 2px solid #1a1a2e;
      border-radius: 0 0 25px 25px;
      border-top: none;
      top: 62px;
      left: 31px;
      z-index: 6;
    }

    .villain-arm {
      position: absolute;
      width: 42px;
      height: 110px;
      background: linear-gradient(90deg, #4a5f8f 0%, #3d4d7a 100%);
      border-radius: 20px;
      top: 55px;
      box-shadow: inset -2px -5px 10px rgba(0, 0, 0, 0.3), 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(109, 213, 255, 0.1);
    }

    .villain-arm-left {
      left: -38px;
      transform: rotate(-15deg);
      transform-origin: top right;
    }

    .villain-arm-right {
      right: -38px;
      transform: rotate(15deg);
      transform-origin: top left;
    }

    .villain-gauntlet {
      position: absolute;
      width: 40px;
      height: 38px;
      background: linear-gradient(135deg, #6dd5ff 0%, #3b82f6 100%);
      border-radius: 50%;
      bottom: 0;
      left: 1px;
      box-shadow: inset -2px -3px 8px rgba(0, 0, 0, 0.3), 0 0 10px rgba(109, 213, 255, 0.5);
    }

    .villain-leg {
      position: absolute;
      width: 38px;
      height: 120px;
      background: linear-gradient(90deg, #3d3d5c 0%, #2d2d4a 100%);
      border-radius: 20px;
      bottom: -120px;
      box-shadow: inset -2px -5px 12px rgba(0, 0, 0, 0.4), 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 0 8px rgba(109, 213, 255, 0.08);
    }

    .villain-leg-left {
      left: 35px;
    }

    .villain-leg-right {
      right: 35px;
    }

    .villain-boot {
      position: absolute;
      width: 42px;
      height: 28px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
      border-radius: 5px 5px 20px 20px;
      bottom: -28px;
      left: -2px;
      box-shadow: inset -1px -2px 5px rgba(0, 0, 0, 0.6), 0 0 8px rgba(109, 213, 255, 0.2);
    }

    /* Animation States */
    .fighter.attacking .ladybug-arm-right,
    .fighter.attacking .villain-arm-right {
      animation: punch-right 0.3s ease;
    }

    .fighter.attacking .ladybug-arm-left,
    .fighter.attacking .villain-arm-left {
      animation: punch-left 0.3s ease;
    }

    .fighter.hit {
      animation: hit-shake 0.15s ease;
    }

    .fighter.blocking {
      opacity: 0.95;
    }

    .fighter.jumping {
      animation: jump-up 0.4s ease;
    }

    @keyframes punch-right {
      0% { transform: rotate(20deg); }
      50% { transform: rotate(-30deg) translateX(15px); }
      100% { transform: rotate(20deg); }
    }

    @keyframes punch-left {
      0% { transform: rotate(-20deg); }
      50% { transform: rotate(30deg) translateX(-15px); }
      100% { transform: rotate(-20deg); }
    }

    @keyframes hit-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes jump-up {
      0% { bottom: 80px; }
      50% { bottom: 180px; }
      100% { bottom: 80px; }
    }

    /* Combat Effects */
    .hit-effect {
      position: absolute;
      pointer-events: none;
    }

    .hit-text {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #ff1744;
      text-shadow: 0 0 10px rgba(255, 23, 68, 0.8);
      opacity: 1;
      animation: float-up 0.8s ease-out forwards;
      z-index: 50;
    }

    .hit-text.enemy {
      color: #6dd5ff;
      text-shadow: 0 0 10px rgba(109, 213, 255, 0.8);
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px);
      }
    }

    /* UI Controls */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
    }

    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 100%);
      border-color: #ff1744;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #6dd5ff 0%, #3b82f6 100%);
      border-color: #6dd5ff;
    }

    .message-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 150;
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #ff1744;
      padding: 30px 50px;
      border-radius: 10px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      pointer-events: none;
      animation: message-pop 0.5s ease forwards;
    }

    @keyframes message-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .keys-info {
      position: absolute;
      bottom: 40px;
      left: 20px;
      font-size: 12px;
      opacity: 0.6;
      text-align: left;
    }

    .keys-info div {
      margin: 2px 0;
    }

    @media (max-width: 768px) {
      .fighter {
        width: 140px;
        height: 220px;
      }

      .ladybug-body,
      .villain-body {
        width: 120px;
        height: 160px;
        left: 10px;
        top: 30px;
      }

      .ladybug-head,
      .villain-head {
        width: 70px;
        height: 80px;
        top: -20px;
        left: 25px;
      }

      .btn {
        padding: 8px 16px;
        font-size: 12px;
      }

      .timer-display {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="background">
      <div class="sky"></div>
      <div class="city-silhouette"></div>
      <div class="ground-layer">
        <div class="ground-texture"></div>
      </div>
    </div>

    <div class="hud">
      <div class="player-hud">
        <div class="player-name ladybug-name">Ladybug</div>
        <div class="health-bar-container">
          <div class="health-bar" id="healthBar1"></div>
        </div>
        <div class="info-text" id="p1Info">100 HP</div>
      </div>

      <div class="timer-display" id="timer">60</div>

      <div class="player-hud right">
        <div class="player-name villain-name">Anakondra</div>
        <div class="health-bar-container">
          <div class="health-bar villain" id="healthBar2"></div>
        </div>
        <div class="info-text" id="p2Info">100 HP</div>
      </div>
    </div>

    <div class="game-area">
      <div class="fighters-container">
        <div class="fighter p1" id="fighter1">
          <div class="fighter-sprite">
            <div class="ladybug-body">
              <div class="ladybug-spot spot-1 ladybug-spot-large"></div>
              <div class="ladybug-spot spot-2 ladybug-spot-large"></div>
              <div class="ladybug-spot spot-3 ladybug-spot-medium"></div>
              <div class="ladybug-spot spot-4 ladybug-spot-medium"></div>
              <div class="ladybug-spot spot-5 ladybug-spot-small"></div>
              <div class="ladybug-spot spot-6 ladybug-spot-small"></div>
            </div>
            <div class="ladybug-head">
              <div class="ladybug-ear ladybug-ear-left"></div>
              <div class="ladybug-ear ladybug-ear-right"></div>
              <div class="ladybug-mask"></div>
              <div class="ladybug-eye ladybug-eye-left"></div>
              <div class="ladybug-eye ladybug-eye-right"></div>
              <div class="ladybug-mouth"></div>
            </div>
            <div class="ladybug-arm ladybug-arm-left">
              <div class="ladybug-glove"></div>
            </div>
            <div class="ladybug-arm ladybug-arm-right">
              <div class="ladybug-glove"></div>
            </div>
            <div class="ladybug-leg ladybug-leg-left">
              <div class="ladybug-shoe"></div>
            </div>
            <div class="ladybug-leg ladybug-leg-right">
              <div class="ladybug-shoe"></div>
            </div>
          </div>
        </div>

        <div class="fighter p2" id="fighter2">
          <div class="fighter-sprite">
            <div class="villain-body">
              <div class="villain-accent villain-accent-1"></div>
              <div class="villain-accent villain-accent-2"></div>
              <div class="villain-accent villain-accent-3"></div>
            </div>
            <div class="villain-head">
              <div class="villain-horn villain-horn-left"></div>
              <div class="villain-horn villain-horn-right"></div>
              <div class="villain-eye villain-eye-left">
                <div class="villain-pupil"></div>
              </div>
              <div class="villain-eye villain-eye-right">
                <div class="villain-pupil"></div>
              </div>
              <div class="villain-mouth"></div>
            </div>
            <div class="villain-arm villain-arm-left">
              <div class="villain-gauntlet"></div>
            </div>
            <div class="villain-arm villain-arm-right">
              <div class="villain-gauntlet"></div>
            </div>
            <div class="villain-leg villain-leg-left">
              <div class="villain-boot"></div>
            </div>
            <div class="villain-leg villain-leg-right">
              <div class="villain-boot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="keys-info">
      <div><strong>Irányítás:</strong></div>
      <div>W - Ugrás | A/D - Mozgás</div>
      <div>Space - Ütés | E - Speciális</div>
      <div>Shift - Blokk | Q - Dodge</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">JÁTÉK INDÍTÁSA</button>
      <button class="btn btn-secondary" id="resetBtn">ÚJRAINDÍTÁS</button>
    </div>
  </div>

  <script>
    const game = {
      running: false,
      roundTime: 60,
      p1Health: 100,
      p2Health: 100,
      p1X: 50,
      p2X: 450,
      p1Y: 0,
      p2Y: 0,
      p1VelY: 0,
      p2VelY: 0,
      gravity: 0.5,
      p1Jumping: false,
      p2Jumping: false,
      p1Attacking: false,
      p2Attacking: false,
      p1Blocking: false,
      p2Blocking: false,
      gameOver: false,
      winner: null,
      keys: {},
      lastAttackTime1: 0,
      lastAttackTime2: 0,
      attackCooldown: 300,
    };

    const fighter1El = document.getElementById('fighter1');
    const fighter2El = document.getElementById('fighter2');
    const healthBar1 = document.getElementById('healthBar1');
    const healthBar2 = document.getElementById('healthBar2');
    const p1Info = document.getElementById('p1Info');
    const p2Info = document.getElementById('p2Info');
    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updatePositions() {
      fighter1El.style.left = game.p1X + 'px';
      fighter1El.style.bottom = game.p1Y + 'px';
      fighter2El.style.right = game.p2X + 'px';
      fighter2El.style.bottom = game.p2Y + 'px';
    }

    function updateHealth() {
      const h1 = Math.max(0, game.p1Health);
      const h2 = Math.max(0, game.p2Health);
      healthBar1.style.width = h1 + '%';
      healthBar2.style.width = h2 + '%';
      p1Info.textContent = Math.ceil(h1) + ' HP';
      p2Info.textContent = Math.ceil(h2) + ' HP';
    }

    function showMessage(text, duration = 1000) {
      const box = document.createElement('div');
      box.className = 'message-box';
      box.textContent = text;
      document.querySelector('.game-container').appendChild(box);
      setTimeout(() => box.remove(), duration + 500);
    }

    function damage(player, amount) {
      if (player === 1) {
        game.p1Health = Math.max(0, game.p1Health - amount);
      } else {
        game.p2Health = Math.max(0, game.p2Health - amount);
      }
      updateHealth();

      if (game.p1Health <= 0) {
        endGame('Anakondra Nyert!');
      } else if (game.p2Health <= 0) {
        endGame('Ladybug Nyert!');
      }
    }

    function attack(attacker) {
      const now = Date.now();
      const isP1 = attacker === 1;
      const lastTime = isP1 ? game.lastAttackTime1 : game.lastAttackTime2;

      if (now - lastTime < game.attackCooldown) return;

      if (isP1) {
        game.lastAttackTime1 = now;
        game.p1Attacking = true;
        fighter1El.classList.add('attacking');
        setTimeout(() => {
          game.p1Attacking = false;
          fighter1El.classList.remove('attacking');
        }, 300);

        const dmg = 12 + Math.random() * 8;
        if (!game.p2Blocking) {
          damage(2, dmg);
          fighter2El.classList.add('hit');
          setTimeout(() => fighter2El.classList.remove('hit'), 150);
        } else {
          damage(2, dmg * 0.3);
        }
      } else {
        game.lastAttackTime2 = now;
        game.p2Attacking = true;
        fighter2El.classList.add('attacking');
        setTimeout(() => {
          game.p2Attacking = false;
          fighter2El.classList.remove('attacking');
        }, 300);

        const dmg = 12 + Math.random() * 8;
        if (!game.p1Blocking) {
          damage(1, dmg);
          fighter1El.classList.add('hit');
          setTimeout(() => fighter1El.classList.remove('hit'), 150);
        } else {
          damage(1, dmg * 0.3);
        }
      }
    }

    function jump(player) {
      if (player === 1 && !game.p1Jumping) {
        game.p1Jumping = true;
        game.p1VelY = 15;
        fighter1El.classList.add('jumping');
      } else if (player === 2 && !game.p2Jumping) {
        game.p2Jumping = true;
        game.p2VelY = 15;
        fighter2El.classList.add('jumping');
      }
    }

    function updatePhysics() {
      // P1 Physics
      game.p1VelY -= game.gravity;
      game.p1Y += game.p1VelY;
      if (game.p1Y <= 0) {
        game.p1Y = 0;
        game.p1VelY = 0;
        game.p1Jumping = false;
        fighter1El.classList.remove('jumping');
      }

      // P2 Physics
      game.p2VelY -= game.gravity;
      game.p2Y += game.p2VelY;
      if (game.p2Y <= 0) {
        game.p2Y = 0;
        game.p2VelY = 0;
        game.p2Jumping = false;
        fighter2El.classList.remove('jumping');
      }

      updatePositions();
    }

    function aiLogic() {
      const dist = Math.abs(game.p1X - (game.p2X - 100));
      if (dist < 150) {
        if (Math.random() < 0.05) attack(2);
        if (Math.random() < 0.03) jump(2);
      }
      if (Math.random() < 0.02) {
        game.p2X = Math.max(50, Math.min(450, game.p2X + (Math.random() - 0.5) * 60));
      }
    }

    function gameLoop() {
      if (!game.running || game.gameOver) return;

      updatePhysics();
      aiLogic();

      if (Math.abs(game.p1X - (game.p2X - 100)) < 80) {
        if (game.keys[' ']) {
          attack(1);
          game.keys[' '] = false;
        }
      }

      if (game.keys['a'] || game.keys['A']) game.p1X = Math.max(10, game.p1X - 5);
      if (game.keys['d'] || game.keys['D']) game.p1X = Math.min(450, game.p1X + 5);
      if (game.keys['w'] || game.keys['W']) jump(1);
      if (game.keys['Shift']) game.p1Blocking = true;
      else game.p1Blocking = false;

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      game.running = true;
      game.gameOver = false;
      game.winner = null;
      game.p1Health = 100;
      game.p2Health = 100;
      game.p1X = 50;
      game.p2X = 450;
      game.p1Y = 0;
      game.p2Y = 0;
      game.roundTime = 60;
      updateHealth();
      updatePositions();
      showMessage('BITKA KEZDŐDIK!', 1200);
      gameLoop();
    }

    function endGame(msg) {
      game.gameOver = true;
      game.running = false;
      showMessage(msg, 1500);
    }

    function resetGame() {
      game.running = false;
      game.gameOver = false;
      game.p1Health = 100;
      game.p2Health = 100;
      game.p1X = 50;
      game.p2X = 450;
      game.p1Y = 0;
      game.p2Y = 0;
      game.roundTime = 60;
      timerEl.textContent = '60';
      updateHealth();
      updatePositions();
      fighter1El.classList.remove('attacking', 'hit', 'jumping');
      fighter2El.classList.remove('attacking', 'hit', 'jumping');
    }

    let timerInterval;
    startBtn.addEventListener('click', () => {
      resetGame();
      clearInterval(timerInterval);
      startGame();
      timerInterval = setInterval(() => {
        game.roundTime--;
        timerEl.textContent = Math.max(0, game.roundTime);
        if (game.roundTime <= 0) {
          clearInterval(timerInterval);
          if (game.p1Health > game.p2Health) {
            endGame('Ladybug Nyert!');
          } else if (game.p2Health > game.p1Health) {
            endGame('Anakondra Nyert!');
          } else {
            endGame('Döntetlen!');
          }
        }
      }, 1000);
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      resetGame();
      showMessage('JÁTÉK ALAPHELYZETBE ÁLLÍTVA', 800);
    });

    document.addEventListener('keydown', (e) => {
      game.keys[e.key] = true;
      if (e.code === 'Space' && game.running && !game.gameOver) {
        e.preventDefault();
        attack(1);
      }
    });

    document.addEventListener('keyup', (e) => {
      game.keys[e.key] = false;
    });

    resetGame();
  </script>
</body>
</html>
