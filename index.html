<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miraculous Clash</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0a1020;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      color: white;
    }
    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(96vw, 1280px);
      height: min(92vh, 820px);
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, #0f1d33 0%, #0b1729 20%, #0b0d12 100%);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 0 40px rgba(0,0,0,0.25);
    }

    .sky {
      position: absolute;
      inset: 0 0 25% 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(161,201,255,0.22), transparent 18%),
        radial-gradient(circle at 75% 8%, rgba(255,255,255,0.18), transparent 12%),
        linear-gradient(180deg, #203d60 0%, #1d2f4e 30%, #13233c 64%, #0f1727 100%);
    }

    .moon {
      position: absolute;
      right: 17%;
      top: 8%;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf2 0%, #e8e0bf 36%, #d5d7d9 68%, rgba(255,255,255,0.12) 100%);
      box-shadow: 0 0 45px rgba(255,255,255,0.35);
      opacity: 0.85;
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 120px;
      height: 240px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2)),
        repeating-linear-gradient(
          90deg,
          rgba(13,18,30,0.88) 0 32px,
          rgba(18,28,39,0.9) 32px 70px,
          rgba(12,17,26,0.92) 70px 108px
        );
      opacity: 0.75;
    }

    .city::before {
      content: "";
      position: absolute;
      inset: 20px 0 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(29,40,58,0.9) 0 30px,
          rgba(18,25,37,0.82) 30px 58px,
          rgba(12,18,25,0.9) 58px 84px
        );
      clip-path: polygon(0 100%, 0 30%, 8% 30%, 8% 10%, 14% 10%, 14% 35%, 22% 35%, 22% 8%, 28% 8%, 28% 36%, 36% 36%, 36% 14%, 43% 14%, 43% 34%, 50% 34%, 50% 12%, 58% 12%, 58% 36%, 66% 36%, 66% 9%, 73% 9%, 73% 36%, 81% 36%, 81% 15%, 90% 15%, 90% 38%, 100% 38%, 100% 100%);
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 130px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.7)),
        linear-gradient(90deg, #0a0d12 0%, #141a20 15%, #0d1116 100%);
      border-top: 2px solid rgba(255,255,255,0.12);
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 7px, rgba(255,255,255,0.015) 7px 22px);
      opacity: 0.8;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0 30px;
      pointer-events: none;
    }

    .player-panel {
      width: 38%;
      min-width: 220px;
    }

    .player-panel.right { text-align: right; }

    .player-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 4px 18px rgba(0,0,0,0.75);
    }

    .player-name.ladybug { color: #ff5d79; }
    .player-name.villain { color: #73c6ff; }

    .bar {
      position: relative;
      width: 100%;
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(17,21,26,0.8);
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 14px rgba(0,0,0,0.5);
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #67f0a6, #a5ffd0);
      box-shadow: 0 0 16px rgba(103,240,166,0.45);
      transition: width 0.18s ease;
    }

    .player-panel.right .bar-fill {
      background: linear-gradient(90deg, #8cc5ff, #4fa2ff);
      box-shadow: 0 0 16px rgba(79,162,255,0.45);
    }

    .timer {
      min-width: 100px;
      height: 72px;
      display: grid;
      place-items: center;
      font-size: clamp(1.7rem, 2vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #ffe49a;
      background: rgba(11,15,22,0.7);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.06), 0 0 20px rgba(255,196,87,0.2);
      text-shadow: 0 0 18px rgba(255,196,87,0.7);
    }

    .arena {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .fighter {
      position: absolute;
      bottom: 120px;
      width: 190px;
      height: 310px;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.38));
      user-select: none;
      transition: transform 0.12s ease;
    }

    .fighter.p1 { left: 11%; }
    .fighter.p2 { right: 11%; transform: scaleX(-1); }

    .fighter.hit { animation: shake 0.18s ease; }
    .fighter.jumping { animation: jumpUp 0.42s ease; }
    .fighter.attacking .arm-right,
    .fighter.attacking .arm-left { animation: punch 0.26s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes jumpUp {
      0% { bottom: 120px; }
      20% { bottom: 180px; }
      60% { bottom: 200px; }
      100% { bottom: 120px; }
    }

    @keyframes punch {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(-32deg) translateX(-6px); }
      100% { transform: rotate(0deg); }
    }

    .fighter-body {
      position: absolute;
      inset: 0;
    }

    .ladybug .head {
      position: absolute;
      left: 52px;
      top: 10px;
      width: 88px;
      height: 96px;
      border-radius: 48% 48% 50% 50% / 52% 52% 48% 48%;
      background: linear-gradient(180deg, #ffd7d1 0%, #f9d4c2 45%, #f1b9a1 100%);
      box-shadow: inset -6px -8px 12px rgba(0,0,0,0.08), 0 0 0 3px rgba(28,20,17,0.12);
      z-index: 4;
    }

    .ladybug .head::before,
    .ladybug .head::after {
      content: "";
      position: absolute;
      top: -18px;
      width: 20px;
      height: 24px;
      border-radius: 50% 50% 40% 40%;
      background: linear-gradient(180deg, #ff6f7d, #d93d54);
      box-shadow: inset 0 -2px 6px rgba(0,0,0,0.12);
    }

    .ladybug .head::before { left: 10px; transform: rotate(-18deg); }
    .ladybug .head::after { right: 10px; transform: rotate(18deg); }

    .ladybug .hair {
      position: absolute;
      left: 40px;
      top: 4px;
      width: 110px;
      height: 70px;
      border-radius: 52% 48% 46% 54% / 60% 64% 36% 40%;
      background: linear-gradient(180deg, #2c2d34 0%, #17191d 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.04);
      z-index: 5;
    }

    .ladybug .face {
      position: absolute;
      left: 65px;
      top: 30px;
      width: 58px;
      height: 52px;
      border-radius: 42% 42% 48% 48%;
      background: rgba(255,255,255,0.08);
      z-index: 6;
    }

    .ladybug .eye {
      position: absolute;
      top: 40px;
      width: 12px;
      height: 15px;
      border-radius: 50%;
      background: #181d2b;
      z-index: 7;
      box-shadow: inset -2px -2px 4px rgba(255,255,255,0.08);
    }

    .ladybug .eye.left { left: 71px; }
    .ladybug .eye.right { left: 99px; }

    .ladybug .eye::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 6px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      left: 3px;
      top: 2px;
    }

    .ladybug .smile {
      position: absolute;
      left: 79px;
      top: 57px;
      width: 22px;
      height: 12px;
      border-bottom: 3px solid #2a1b1f;
      border-radius: 0 0 18px 18px;
      z-index: 7;
    }

    .ladybug .torso {
      position: absolute;
      left: 45px;
      top: 100px;
      width: 100px;
      height: 110px;
      border-radius: 26% 26% 24% 24% / 30% 30% 24% 24%;
      background: linear-gradient(180deg, #fefefe 0%, #eaf6ff 55%, #dcebf8 100%);
      box-shadow: inset 0 -10px 0 rgba(54,85,128,0.06), inset 0 0 0 3px rgba(28,34,43,0.12);
      z-index: 3;
    }

    .ladybug .torso::before, .ladybug .torso::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 18px;
      top: 18px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff4b6e, #d22d4d);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
    }
    .ladybug .torso::before { left: 16px; }
    .ladybug .torso::after { right: 16px; }

    .ladybug .arm {
      position: absolute;
      width: 20px;
      height: 92px;
      top: 118px;
      border-radius: 18px;
      background: linear-gradient(180deg, #f7cfbf, #f0ab8a 60%, #e9986e 100%);
      box-shadow: inset -3px -6px 8px rgba(0,0,0,0.06);
      z-index: 2;
    }

    .ladybug .arm.left { left: 20px; transform: rotate(-10deg); }
    .ladybug .arm.right { right: 20px; transform: rotate(10deg); }

    .ladybug .arm.right::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      right: -8px;
      bottom: -6px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff4b6e, #d22d4d);
      box-shadow: inset -2px -4px 8px rgba(0,0,0,0.12);
    }

    .ladybug .leg {
      position: absolute;
      width: 24px;
      height: 92px;
      top: 200px;
      border-radius: 18px;
      background: linear-gradient(180deg, #d8e4fa, #b5c5de 52%, #8ea4c1 100%);
      z-index: 1;
    }

    .ladybug .leg.left { left: 62px; }
    .ladybug .leg.right { left: 104px; }

    .ladybug .shoe {
      position: absolute;
      width: 32px;
      height: 18px;
      background: linear-gradient(180deg, #18212f, #0d1218 100%);
      bottom: -12px;
      left: -4px;
      border-radius: 12px 14px 12px 12px;
    }

    .villain .head {
      position: absolute;
      left: 52px;
      top: 10px;
      width: 88px;
      height: 96px;
      border-radius: 48% 48% 50% 50% / 52% 52% 48% 48%;
      background: linear-gradient(180deg, #d2dff6 0%, #b9bfd6 48%, #7d8cb1 100%);
      box-shadow: inset -6px -8px 12px rgba(0,0,0,0.1), 0 0 0 3px rgba(23,26,36,0.14);
      z-index: 4;
    }

    .villain .head::before,
    .villain .head::after {
      content: "";
      position: absolute;
      top: -18px;
      width: 22px;
      height: 38px;
      background: linear-gradient(180deg, #6bd4ff, #2e8bf4);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      filter: drop-shadow(0 0 16px rgba(107,212,255,0.5));
    }

    .villain .head::before { left: 8px; transform: rotate(-18deg); }
    .villain .head::after { right: 8px; transform: rotate(18deg); }

    .villain .hair {
      position: absolute;
      left: 42px;
      top: 4px;
      width: 108px;
      height: 66px;
      border-radius: 45% 50% 48% 52% / 60% 56% 44% 40%;
      background: linear-gradient(180deg, #2d2943, #1b1625);
      z-index: 5;
    }

    .villain .eye {
      position: absolute;
      top: 42px;
      width: 14px;
      height: 17px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #8de0ff, #51a6ff 45%, #1d4fb4 100%);
      z-index: 7;
      box-shadow: 0 0 12px rgba(87,181,255,0.7);
    }

    .villain .eye.left { left: 71px; }
    .villain .eye.right { left: 100px; }

    .villain .smile {
      position: absolute;
      left: 76px;
      top: 60px;
      width: 30px;
      height: 14px;
      border-bottom: 3px solid #1d1d2b;
      border-radius: 0 0 24px 24px;
      z-index: 7;
    }

    .villain .torso {
      position: absolute;
      left: 45px;
      top: 100px;
      width: 100px;
      height: 110px;
      border-radius: 26% 26% 26% 26% / 30% 30% 24% 24%;
      background: linear-gradient(180deg, #4b3c6d 0%, #2a233d 55%, #1a1d29 100%);
      box-shadow: inset 0 -10px 12px rgba(0,0,0,0.18), inset 0 0 0 3px rgba(105,116,179,0.12);
      z-index: 3;
    }

    .villain .torso::before, .villain .torso::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 18px;
      top: 16px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f7d54c, #d09d23);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
    }
    .villain .torso::before { left: 16px; }
    .villain .torso::after { right: 16px; }

    .villain .arm {
      position: absolute;
      width: 20px;
      height: 92px;
      top: 118px;
      border-radius: 18px;
      background: linear-gradient(180deg, #d5e5ff, #98afd9 55%, #6880af 100%);
      box-shadow: inset -3px -6px 8px rgba(0,0,0,0.08);
      z-index: 2;
    }

    .villain .arm.left { left: 20px; transform: rotate(-10deg); }
    .villain .arm.right { right: 20px; transform: rotate(10deg); }

    .villain .arm.right::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      right: -8px;
      bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(180deg, #78d1ff, #2f89ff 100%);
      box-shadow: inset -2px -4px 8px rgba(0,0,0,0.18), 0 0 16px rgba(107,212,255,0.3);
    }

    .villain .leg {
      position: absolute;
      width: 24px;
      height: 92px;
      top: 200px;
      border-radius: 18px;
      background: linear-gradient(180deg, #2b3040, #171e2c 52%, #0d131d 100%);
      z-index: 1;
    }
    .villain .leg.left { left: 62px; }
    .villain .leg.right { left: 104px; }

    .villain .shoe {
      position: absolute;
      width: 32px;
      height: 18px;
      background: linear-gradient(180deg, #0c1220, #05070b 100%);
      bottom: -12px;
      left: -4px;
      border-radius: 12px 14px 12px 12px;
    }

    .attack-flash {
      position: absolute;
      width: 120px;
      height: 120px;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.1) 28%, transparent 65%);
      filter: blur(2px);
    }

    .fighter.attacking .attack-flash {
      animation: flash 0.3s ease;
    }

    @keyframes flash {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }

    .hit-label {
      position: absolute;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ff5d79;
      text-shadow: 0 0 14px rgba(255,93,121,0.75);
      animation: labelPop 0.7s ease forwards;
      pointer-events: none;
      z-index: 60;
    }

    @keyframes labelPop {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-38px) scale(1.1); }
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(16,20,27,0.72);
      color: white;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 12px 22px rgba(0,0,0,0.25);
    }

    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(180deg, rgba(255,93,121,0.95), rgba(185,37,70,0.95)); }
    .btn.secondary { background: linear-gradient(180deg, rgba(115,198,255,0.9), rgba(55,95,178,0.9)); }

    .message {
      position: absolute;
      left: 50%;
      top: 105px;
      transform: translateX(-50%);
      z-index: 60;
      background: rgba(8,11,18,0.8);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .game-shell { width: 98vw; height: 88vh; }
      .fighter { width: 160px; height: 270px; }
      .player-panel { min-width: 180px; }
      .btn { padding: 10px 14px; font-size: 0.74rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="sky"></div>
    <div class="moon"></div>
    <div class="city"></div>
    <div class="ground"></div>

    <div class="hud">
      <div class="player-panel left">
        <div class="player-name ladybug">Ladybug</div>
        <div class="bar"><div id="p1Bar" class="bar-fill" style="width: 100%"></div></div>
      </div>

      <div class="timer" id="timer">60</div>

      <div class="player-panel right">
        <div class="player-name villain">Anakondra</div>
        <div class="bar"><div id="p2Bar" class="bar-fill" style="width: 100%"></div></div>
      </div>
    </div>

    <div class="arena">
      <div id="fighter1" class="fighter p1 ladybug">
        <div class="fighter-body">
          <div class="hair"></div>
          <div class="head"></div>
          <div class="face"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
          <div class="shoe left"></div>
          <div class="shoe right"></div>
          <div class="attack-flash"></div>
        </div>
      </div>

      <div id="fighter2" class="fighter p2 villain">
        <div class="fighter-body">
          <div class="hair"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
          <div class="shoe left"></div>
          <div class="shoe right"></div>
          <div class="attack-flash"></div>
        </div>
      </div>
    </div>

    <div id="message" class="message">Csata kezdődik</div>

    <div class="controls">
      <button id="startBtn" class="btn primary">Játék</button>
      <button id="resetBtn" class="btn secondary">Újra</button>
    </div>
  </div>

  <script>
    const state = {
      running: false,
      roundTime: 60,
      p1Health: 100,
      p2Health: 100,
      p1X: 140,
      p2X: 870,
      p1Y: 0,
      p2Y: 0,
      p1Vy: 0,
      p2Vy: 0,
      gravity: 0.7,
      p1Jumping: false,
      p2Jumping: false,
      p1Blocking: false,
      p2Blocking: false,
      p1AttackCooldown: 0,
      p2AttackCooldown: 0,
      keyState: {},
      lastTimestamp: 0,
      timerId: null,
    };

    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const timerEl = document.getElementById('timer');
    const p1Bar = document.getElementById('p1Bar');
    const p2Bar = document.getElementById('p2Bar');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function showMessage(text, duration = 1200) {
      messageEl.textContent = text;
      messageEl.classList.add('show');
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => messageEl.classList.remove('show'), duration);
    }

    function updateBars() {
      p1Bar.style.width = state.p1Health + '%';
      p2Bar.style.width = state.p2Health + '%';
    }

    function setFighterPositions() {
      fighter1.style.left = state.p1X + 'px';
      fighter1.style.bottom = state.p1Y + 'px';
      fighter2.style.left = state.p2X + 'px';
      fighter2.style.bottom = state.p2Y + 'px';
    }

    function addHitText(player, value) {
      const label = document.createElement('div');
      label.className = 'hit-label';
      label.textContent = '-' + Math.round(value);
      label.style.left = player === 1 ? (state.p1X + 100) + 'px' : (state.p2X + 70) + 'px';
      label.style.top = player === 1 ? '120px' : '120px';
      label.style.color = player === 1 ? '#ff5d79' : '#73c6ff';
      document.querySelector('.arena').appendChild(label);
      setTimeout(() => label.remove(), 700);
    }

    function damage(target, amount) {
      if (target === 1) {
        state.p1Health = clamp(state.p1Health - amount, 0, 100);
        fighter1.classList.add('hit');
        setTimeout(() => fighter1.classList.remove('hit'), 180);
        addHitText(1, amount);
      } else {
        state.p2Health = clamp(state.p2Health - amount, 0, 100);
        fighter2.classList.add('hit');
        setTimeout(() => fighter2.classList.remove('hit'), 180);
        addHitText(2, amount);
      }
      updateBars();
      if (state.p1Health <= 0) endRound('Anakondra győzött!');
      if (state.p2Health <= 0) endRound('Ladybug győzött!');
    }

    function attack(player) {
      if (!state.running) return;
      if (player === 1 && state.p1AttackCooldown > 0) return;
      if (player === 2 && state.p2AttackCooldown > 0) return;

      const attacker = player === 1 ? fighter1 : fighter2;
      const target = player === 1 ? fighter2 : fighter1;
      attacker.classList.add('attacking');
      setTimeout(() => attacker.classList.remove('attacking'), 220);

      const dist = Math.abs(state.p1X - state.p2X);
      if (player === 1 && dist < 170) {
        const dmg = (state.p2Blocking ? 4 : 10) + Math.random() * 8;
        damage(2, dmg);
      }
      if (player === 2 && dist < 170) {
        const dmg = (state.p1Blocking ? 4 : 10) + Math.random() * 8;
        damage(1, dmg);
      }

      if (player === 1) state.p1AttackCooldown = 360;
      else state.p2AttackCooldown = 420;
    }

    function special(player) {
      if (!state.running) return;
      if (player === 1 && state.p1AttackCooldown > 0) return;
      if (player === 2 && state.p2AttackCooldown > 0) return;

      const attacker = player === 1 ? fighter1 : fighter2;
      attacker.classList.add('attacking');
      setTimeout(() => attacker.classList.remove('attacking'), 260);

      const dist = Math.abs(state.p1X - state.p2X);
      if (dist < 210) {
        if (player === 1) {
          damage(2, state.p2Blocking ? 8 : 18);
        } else {
          damage(1, state.p1Blocking ? 8 : 18);
        }
      }

      if (player === 1) state.p1AttackCooldown = 700;
      else state.p2AttackCooldown = 800;
    }

    function jump(player) {
      if (!state.running) return;
      if (player === 1) {
        if (state.p1Jumping) return;
        state.p1Jumping = true;
        state.p1Vy = 16;
        fighter1.classList.add('jumping');
      } else {
        if (state.p2Jumping) return;
        state.p2Jumping = true;
        state.p2Vy = 16;
        fighter2.classList.add('jumping');
      }
    }

    function startRound() {
      state.running = true;
      state.roundTime = 60;
      state.p1Health = 100;
      state.p2Health = 100;
      state.p1X = 140;
      state.p2X = 870;
      state.p1Y = 0;
      state.p2Y = 0;
      state.p1Vy = 0;
      state.p2Vy = 0;
      state.p1Jumping = false;
      state.p2Jumping = false;
      state.p1Blocking = false;
      state.p2Blocking = false;
      updateBars();
      setFighterPositions();
      showMessage('Csata kezdődik', 1200);
      timerEl.textContent = '60';
      clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        if (!state.running) return;
        state.roundTime -= 1;
        timerEl.textContent = state.roundTime;
        if (state.roundTime <= 0) {
          if (state.p1Health > state.p2Health) endRound('Ladybug győzött!');
          else if (state.p2Health > state.p1Health) endRound('Anakondra győzött!');
          else endRound('Döntetlen!');
        }
      }, 1000);
    }

    function endRound(text) {
      state.running = false;
      clearInterval(state.timerId);
      showMessage(text, 1800);
    }

    function resetGame() {
      clearInterval(state.timerId);
      state.running = false;
      state.roundTime = 60;
      timerEl.textContent = '60';
      state.p1Health = 100;
      state.p2Health = 100;
      state.p1X = 140;
      state.p2X = 870;
      state.p1Y = 0;
      state.p2Y = 0;
      state.p1Vy = 0;
      state.p2Vy = 0;
      state.p1Jumping = false;
      state.p2Jumping = false;
      state.p1Blocking = false;
      state.p2Blocking = false;
      state.p1AttackCooldown = 0;
      state.p2AttackCooldown = 0;
      setFighterPositions();
      updateBars();
      fighter1.classList.remove('jumping', 'attacking', 'hit');
      fighter2.classList.remove('jumping', 'attacking', 'hit');
      showMessage('Kész', 900);
    }

    function physics() {
      if (!state.running) return;

      // Player 1 gravity and input
      if (state.keyState['d']) state.p1X = clamp(state.p1X + 6, 40, 540);
      if (state.keyState['a']) state.p1X = clamp(state.p1X - 6, 40, 540);
      if (state.keyState['s']) state.p1Blocking = true;
      else state.p1Blocking = false;
      if (state.keyState['w'] && !state.p1Jumping) jump(1);
      if (state.keyState[' ']) attack(1);
      if (state.keyState['e']) special(1);

      state.p1Vy -= state.gravity;
      state.p1Y += state.p1Vy;
      if (state.p1Y <= 0) {
        state.p1Y = 0;
        state.p1Vy = 0;
        state.p1Jumping = false;
        fighter1.classList.remove('jumping');
      }

      // Enemy AI
      const enemyGap = Math.abs(state.p1X - state.p2X);
      if (enemyGap > 160) {
        const dir = state.p1X < state.p2X ? -1 : 1;
        state.p2X += dir * 1.6;
      } else if (enemyGap < 120) {
        if (Math.random() < 0.025) attack(2);
        if (Math.random() < 0.01) special(2);
      }
      if (Math.random() < 0.003) jump(2);

      state.p2Vy -= state.gravity;
      state.p2Y += state.p2Vy;
      if (state.p2Y <= 0) {
        state.p2Y = 0;
        state.p2Vy = 0;
        state.p2Jumping = false;
        fighter2.classList.remove('jumping');
      }

      // cooldowns
      if (state.p1AttackCooldown > 0) state.p1AttackCooldown -= 16;
      if (state.p2AttackCooldown > 0) state.p2AttackCooldown -= 16;

      setFighterPositions();
      requestAnimationFrame(physics);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['a','d','w','s','e',' '].includes(key) || key === 'shift') {
        event.preventDefault();
      }
      if (key === ' ') {
        state.keyState[' '] = true;
      } else if (key === 'shift') {
        state.keyState['shift'] = true;
      } else {
        state.keyState[key] = true;
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key === ' ') {
        state.keyState[' '] = false;
      } else if (key === 'shift') {
        state.keyState['shift'] = false;
      } else {
        state.keyState[key] = false;
      }
    });

    startBtn.addEventListener('click', startRound);
    resetBtn.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(physics);
  </script>
</body>
</html>
