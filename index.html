<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miraculous Clash</title>
  <style>
    :root {
      --bg1: #0a1020;
      --bg2: #101827;
      --panel: rgba(17, 20, 31, 0.85);
      --border: rgba(255,255,255,0.18);
      --red: #ff4d6d;
      --pink: #ff8cc6;
      --gold: #ffd166;
      --cyan: #4ecdc4;
      --blue: #3a86ff;
      --green: #7ae582;
      --shadow: rgba(0,0,0,0.5);
      --health: #6ef0a6;
      --health-d: #ff5d73;
      --ui: #f3f5ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(52,76,112,0.9), transparent 35%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(96vw, 1200px);
      height: min(92vh, 760px);
      border: 2px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(9,14,24,0.9), rgba(16,20,31,0.96));
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .arena {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(25,33,55,0.5), rgba(6,10,16,0.25)),
        linear-gradient(180deg, #14253d 0%, #203d5d 30%, #112131 60%, #0c151d 100%);
    }

    .sky {
      position: absolute;
      inset: 0 0 28% 0;
      background: linear-gradient(180deg, rgba(129,189,255,0.15), rgba(0,0,0,0));
    }

    .moon {
      position: absolute;
      right: 18%;
      top: 9%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f8f1cc, #d7d0a7 45%, #c7c7c7 70%, rgba(255,255,255,0.15) 100%);
      box-shadow: 0 0 35px rgba(255,255,255,0.4);
      opacity: 0.8;
    }

    .city {
      position: absolute;
      bottom: 120px;
      left: 0;
      right: 0;
      height: 230px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.28)),
        repeating-linear-gradient(
          90deg,
          rgba(14,22,34,0.9) 0 42px,
          rgba(20,32,42,0.95) 42px 86px,
          rgba(11,17,26,0.9) 86px 126px
        );
      opacity: 0.7;
    }

    .city::before {
      content: "";
      position: absolute;
      inset: 25px 0 0 0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(10,18,28,0.5) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(20,34,49,0.92) 0 25px,
          rgba(17,28,38,0.88) 25px 52px,
          rgba(10,18,29,0.95) 52px 78px
        );
      clip-path: polygon(0 100%, 0 30%, 6% 30%, 6% 10%, 12% 10%, 12% 30%, 18% 30%, 18% 5%, 24% 5%, 24% 30%, 30% 30%, 30% 15%, 37% 15%, 37% 30%, 44% 30%, 44% 10%, 50% 10%, 50% 30%, 56% 30%, 56% 8%, 63% 8%, 63% 30%, 70% 30%, 70% 18%, 76% 18%, 76% 30%, 82% 30%, 82% 14%, 90% 14%, 90% 30%, 100% 30%, 100% 100%);
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background:
        linear-gradient(180deg, rgba(17,18,19,0.2), rgba(4,4,4,0.7)),
        linear-gradient(90deg, #0b0d10 0%, #1a1d22 15%, #12171b 100%);
      border-top: 3px solid rgba(255,255,255,0.12);
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.08) 0 8px,
        rgba(255,255,255,0.02) 8px 24px
      );
      opacity: 0.8;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
    }

    .fighter-panel {
      width: 42%;
      min-width: 230px;
    }

    .fighter-panel.right {
      text-align: right;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--ui);
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    .fighter-panel.right .name-row {
      justify-content: flex-end;
    }

    .name-tag {
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.05rem;
      text-transform: uppercase;
    }

    .health-wrap {
      position: relative;
      width: 100%;
      height: 24px;
      border-radius: 999px;
      background: rgba(16,17,20,0.9);
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .health-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--health), #99ffb8 100%);
      box-shadow: 0 0 16px rgba(110, 240, 166, 0.5);
      transition: width 0.24s ease;
    }

    .fighter-panel.right .health-bar {
      background: linear-gradient(90deg, #ffa0b0, var(--health-d) 70%);
      box-shadow: 0 0 16px rgba(255, 93, 115, 0.45);
    }

    .timer {
      min-width: 110px;
      height: 68px;
      display: grid;
      place-items: center;
      background: rgba(10,12,16,0.72);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff0b2;
      text-shadow: 0 0 18px rgba(255, 209, 102, 0.7);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.08), 0 0 20px rgba(255,209,102,0.2);
    }

    .arena-inner {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .fighter {
      --w: 150px;
      --h: 240px;
      position: absolute;
      bottom: 120px;
      width: var(--w);
      height: var(--h);
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.38));
      transition: transform 0.12s ease, filter 0.12s ease;
      user-select: none;
    }

    .fighter.left {
      left: 17%;
    }

    .fighter.right {
      right: 17%;
      transform: scaleX(-1);
    }

    .fighter .body {
      position: absolute;
      inset: 0;
      border-radius: 35% 35% 25% 25% / 18% 18% 18% 18%;
    }

    .fighter .head {
      position: absolute;
      width: 58%;
      height: 25%;
      left: 21%;
      top: 10%;
      border-radius: 46% 46% 44% 44% / 50% 50% 46% 46%;
      z-index: 3;
    }

    .fighter .torso {
      position: absolute;
      width: 52%;
      height: 36%;
      left: 24%;
      top: 31%;
      border-radius: 24% 24% 18% 18% / 22% 22% 18% 18%;
      z-index: 2;
    }

    .fighter .arm.left,
    .fighter .arm.right,
    .fighter .leg.left,
    .fighter .leg.right,
    .fighter .weapon,
    .fighter .effect,
    .fighter .spark,
    .fighter .face {
      position: absolute;
      display: block;
    }

    .fighter .arm.left,
    .fighter .arm.right {
      width: 14%;
      height: 30%;
      top: 36%;
      border-radius: 18px;
    }

    .fighter .arm.left { left: 14%; }
    .fighter .arm.right { right: 12%; }

    .fighter .leg.left,
    .fighter .leg.right {
      width: 16%;
      height: 32%;
      top: 63%;
      border-radius: 18px;
    }

    .fighter .leg.left { left: 30%; }
    .fighter .leg.right { right: 30%; }

    .fighter .face {
      width: 38%;
      height: 12%;
      left: 31%;
      top: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      z-index: 4;
    }

    .fighter .spark {
      width: 12px;
      height: 12px;
      background: radial-gradient(circle, #fff 0%, #ffd166 28%, rgba(255,209,102,0.2) 100%);
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 12px rgba(255,209,102,0.8);
      z-index: 6;
    }

    .fighter .effect {
      width: 80px;
      height: 80px;
      left: 50%;
      top: 25%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .fighter .weapon {
      width: 18%;
      height: 7%;
      top: 46%;
      left: 62%;
      border-radius: 12px;
      z-index: 4;
      transform-origin: center;
    }

    .fighter.hit .body {
      filter: saturate(1.2) brightness(1.15);
    }

    .fighter.blocking .body {
      filter: brightness(1.1) saturate(1.2);
    }

    .fighter.jump {
      transform: translateY(-22px) scaleY(1.02);
    }

    .fighter.left.jump {
      transform: translateY(-22px) scaleY(1.02);
    }

    .fighter.right.jump {
      transform: scaleX(-1) translateY(-22px) scaleY(1.02);
    }

    .fighter.left.attack .weapon {
      animation: swingL 0.32s ease;
    }

    .fighter.right.attack .weapon {
      animation: swingR 0.32s ease;
    }

    .fighter.left.attack .effect {
      animation: hitPulseL 0.25s ease;
    }

    .fighter.right.attack .effect {
      animation: hitPulseR 0.25s ease;
    }

    @keyframes swingL {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(40deg) translateX(6px); }
      100% { transform: rotate(0deg); }
    }

    @keyframes swingR {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(-40deg) translateX(-6px); }
      100% { transform: rotate(0deg); }
    }

    @keyframes hitPulseL {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.7); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
    }

    @keyframes hitPulseR {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.7) scaleX(-1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55) scaleX(-1); }
    }

    .ladybug {
      --skin: #f9dad0;
      --hair: #1a1a1a;
      --cape: #ff5d8f;
      --suit: #f8fefc;
      --accent: #ff4d6d;
      --spots: #2c2f36;
      --eyes: #0c1422;
    }

    .ladybug .head {
      background: var(--skin);
      border: 3px solid rgba(0,0,0,0.18);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.06);
    }

    .ladybug .hair {
      position: absolute;
      inset: 4% 14% auto 14%;
      height: 25%;
      background: var(--hair);
      border-radius: 52% 48% 42% 58% / 52% 52% 48% 48%;
      z-index: 7;
    }

    .ladybug .face {
      background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(0,0,0,0.02));
      border: 2px solid rgba(0,0,0,0.05);
    }

    .ladybug .eye {
      position: absolute;
      width: 8%;
      height: 10%;
      top: 24%;
      background: var(--eyes);
      border-radius: 50%;
      z-index: 5;
    }

    .ladybug .eye.left { left: 38%; }
    .ladybug .eye.right { right: 38%; }

    .ladybug .smile {
      position: absolute;
      width: 18%;
      height: 8%;
      left: 41%;
      top: 33%;
      border-bottom: 3px solid #000;
      border-radius: 0 0 30px 30px;
      z-index: 5;
    }

    .ladybug .torso {
      background: linear-gradient(180deg, #fff, #e9f7ff 60%, #deeefa 100%);
      border: 3px solid rgba(13, 20, 30, 0.14);
      box-shadow: inset 0 -10px 0 rgba(10,35,52,0.04);
    }

    .ladybug .torso::before,
    .ladybug .torso::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 14%;
      top: 12%;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.32);
    }

    .ladybug .torso::before { left: 15%; }
    .ladybug .torso::after { right: 15%; }

    .ladybug .arm.left,
    .ladybug .arm.right {
      background: linear-gradient(180deg, #f7d9d1, #f0b6a0);
      border: 3px solid rgba(0,0,0,0.10);
    }

    .ladybug .leg.left,
    .ladybug .leg.right {
      background: linear-gradient(180deg, #e5ecff, #b9c7db);
      border: 3px solid rgba(0,0,0,0.12);
    }

    .ladybug .weapon {
      background: linear-gradient(180deg, #f9f4d3, #d8d297);
      border: 3px solid rgba(88,72,22,0.45);
      box-shadow: 0 0 16px rgba(255,218,122,0.35);
      border-radius: 12px;
    }

    .ladybug .effect {
      background: radial-gradient(circle, rgba(255,127,164,0.9), rgba(255,90,120,0.4) 40%, rgba(255,90,120,0.08) 70%, transparent 100%);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .ladybug .body::before {
      content: "";
      position: absolute;
      inset: 10% auto auto 15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, transparent 0 55%, rgba(255,73,111,0.9) 56% 62%, transparent 63% 100%);
      opacity: 0.9;
      border-radius: 50%;
    }

    .villain {
      --skin: #e8c7b2;
      --hair: #2b1b1b;
      --cloak: #4b375d;
      --suit: #201c2a;
      --accent: #f4b942;
      --eyes: #f5d35d;
      --lips: #d9555d;
    }

    .villain .head {
      background: var(--skin);
      border: 3px solid rgba(0,0,0,0.18);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.06);
    }

    .villain .hair {
      position: absolute;
      inset: 5% 14% auto 14%;
      height: 24%;
      background: var(--hair);
      border-radius: 56% 44% 50% 50% / 50% 50% 44% 50%;
      z-index: 7;
    }

    .villain .torso {
      background: linear-gradient(180deg, #5f4b75, #2a1e3a 58%, #151420 100%);
      border: 3px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
    }

    .villain .torso::before,
    .villain .torso::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 15%;
      top: 16%;
      border-radius: 50%;
      background: linear-gradient(180deg, #f7d56d, #b88222);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.10);
    }

    .villain .torso::before { left: 18%; }
    .villain .torso::after { right: 18%; }

    .villain .arm.left,
    .villain .arm.right {
      background: linear-gradient(180deg, #edceb3, #d7ac84);
      border: 3px solid rgba(0,0,0,0.12);
    }

    .villain .leg.left,
    .villain .leg.right {
      background: linear-gradient(180deg, #3a2d44, #1c1b22);
      border: 3px solid rgba(255,255,255,0.06);
    }

    .villain .weapon {
      background: linear-gradient(180deg, #d4edff, #9fc7f8);
      border: 3px solid rgba(18,24,31,0.5);
      box-shadow: 0 0 18px rgba(96, 172, 255, 0.45);
      border-radius: 8px;
    }

    .villain .effect {
      background: radial-gradient(circle, rgba(121,209,255,0.9), rgba(65,136,255,0.55) 40%, rgba(61,104,255,0.08) 70%, transparent 100%);
      border: 2px solid rgba(255,255,255,0.25);
    }

    .villain .eye {
      position: absolute;
      width: 9%;
      height: 11%;
      top: 25%;
      background: var(--eyes);
      border-radius: 50%;
      z-index: 5;
    }

    .villain .eye.left { left: 38%; }
    .villain .eye.right { right: 38%; }

    .villain .smile {
      position: absolute;
      width: 22%;
      height: 9%;
      left: 39%;
      top: 34%;
      border-bottom: 3px solid var(--lips);
      border-radius: 0 0 35px 35px;
      z-index: 5;
    }

    .villain .body::before {
      content: "";
      position: absolute;
      inset: 10% auto auto 13%;
      width: 76%;
      height: 72%;
      background: linear-gradient(180deg, rgba(255,214,88,0.30), rgba(91,88,255,0.18));
      border-radius: 50%;
      opacity: 0.9;
    }

    .actions {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 30;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 82%;
    }

    .button {
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      color: white;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 11px 16px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 12px 20px rgba(0,0,0,0.3);
    }

    .button:active { transform: translateY(1px); }

    .button.primary {
      background: linear-gradient(180deg, rgba(255,127,164,0.95), rgba(211,60,93,0.95));
      border-color: rgba(255,255,255,0.2);
    }

    .button.secondary {
      background: linear-gradient(180deg, rgba(62, 161, 255, 0.85), rgba(43,92,180,0.85));
    }

    .message {
      position: absolute;
      left: 50%;
      top: 95px;
      transform: translateX(-50%);
      min-width: 240px;
      text-align: center;
      padding: 10px 16px;
      border-radius: 12px;
      color: #fff;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(10,12,16,0.64);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 35;
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .game-shell {
        width: 98vw;
        height: 88vh;
      }

      .fighter.left { left: 8%; }
      .fighter.right { right: 8%; }

      .timer {
        min-width: 80px;
        font-size: 1.7rem;
      }

      .actions {
        gap: 8px;
      }

      .button {
        padding: 10px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="arena">
      <div class="sky"></div>
      <div class="moon"></div>
      <div class="city"></div>
      <div class="ground"></div>
    </div>

    <div class="hud">
      <div class="fighter-panel left">
        <div class="name-row">
          <span class="name-tag">Ladybug</span>
        </div>
        <div class="health-wrap">
          <div id="p1Health" class="health-bar" style="width: 100%"></div>
        </div>
      </div>

      <div class="timer" id="timer">60</div>

      <div class="fighter-panel right">
        <div class="name-row">
          <span class="name-tag">Anakondra</span>
        </div>
        <div class="health-wrap">
          <div id="p2Health" class="health-bar" style="width: 100%"></div>
        </div>
      </div>
    </div>

    <div class="arena-inner">
      <div id="fighter1" class="fighter ladybug left">
        <div class="hair"></div>
        <div class="head"></div>
        <div class="face"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="smile"></div>
        <div class="torso"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="weapon"></div>
        <div class="effect"></div>
      </div>

      <div id="fighter2" class="fighter villain right">
        <div class="hair"></div>
        <div class="head"></div>
        <div class="face"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="smile"></div>
        <div class="torso"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="weapon"></div>
        <div class="effect"></div>
      </div>
    </div>

    <div id="message" class="message">KÖZEL A CSATA!</div>

    <div class="actions">
      <button class="button primary" id="toggleMusic">Zene: Be</button>
      <button class="button" id="startBtn">Játék kezdése</button>
      <button class="button secondary" id="resetBtn">Újraindítás</button>
    </div>
  </div>

  <script>
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const p1Health = document.getElementById('p1Health');
    const p2Health = document.getElementById('p2Health');
    const timerEl = document.getElementById('timer');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toggleMusicBtn = document.getElementById('toggleMusic');

    const state = {
      started: false,
      timeLeft: 60,
      p1Health: 100,
      p2Health: 100,
      roundOver: false,
      musicOn: true,
      lastTime: 0,
      lockInputs: false,
      gameLoop: null,
      audio: null,
      musicCtx: null,
      oscillator: null,
      gainNode: null,
      attackCooldown: 0,
      enemyCooldown: 0,
      keyState: {
        a: false, d: false, w: false, s: false,
        j: false, k: false, l: false, i: false
      }
    };

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function showMessage(text, duration = 900) {
      message.textContent = text;
      message.classList.add('show');
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        message.classList.remove('show');
      }, duration);
    }

    function updateHealthBars() {
      p1Health.style.width = state.p1Health + '%';
      p2Health.style.width = state.p2Health + '%';
    }

    function setPlayerStyle(player, x, y, facing = 1) {
      player.style.left = x + 'px';
      player.style.bottom = y + 'px';
      if (facing === -1) {
        player.style.transform = 'scaleX(-1)';
      } else {
        player.style.transform = 'scaleX(1)';
      }
    }

    function triggerHit(player, damage, x, y) {
      player.classList.remove('hit');
      void player.offsetWidth;
      player.classList.add('hit');
      const effect = player.querySelector('.effect');
      effect.style.left = x + '%';
      effect.style.top = y + '%';
      effect.style.opacity = '1';
      effect.style.animation = 'none';
      void effect.offsetWidth;
      effect.style.animation = '';
    }

    function hitPlayer(target, amount) {
      if (state.roundOver) return;
      if (target === 'p1') {
        state.p1Health = clamp(state.p1Health - amount, 0, 100);
        triggerHit(fighter1, amount, 52, 30);
        if (state.p1Health <= 0) {
          endRound('Anakondra nyert!');
        }
      } else {
        state.p2Health = clamp(state.p2Health - amount, 0, 100);
        triggerHit(fighter2, amount, 48, 30);
        if (state.p2Health <= 0) {
          endRound('Ladybug győzött!');
        }
      }
      updateHealthBars();
    }

    function punch(player, target, damage) {
      if (state.roundOver) return;
      if (player === 'p1') {
        fighter1.classList.add('attack');
        setTimeout(() => fighter1.classList.remove('attack'), 180);
        hitPlayer(target, damage);
      } else {
        fighter2.classList.add('attack');
        setTimeout(() => fighter2.classList.remove('attack'), 180);
        hitPlayer(target, damage);
      }
    }

    function doSpecial(player) {
      if (state.roundOver) return;
      if (player === 'p1') {
        fighter1.classList.add('attack');
        triggerHit(fighter1, 22, 52, 20);
        setTimeout(() => fighter1.classList.remove('attack'), 220);
        hitPlayer('p2', 22);
      } else {
        fighter2.classList.add('attack');
        triggerHit(fighter2, 22, 48, 20);
        setTimeout(() => fighter2.classList.remove('attack'), 220);
        hitPlayer('p1', 22);
      }
    }

    function startRound() {
      state.started = true;
      state.roundOver = false;
      state.timeLeft = 60;
      state.p1Health = 100;
      state.p2Health = 100;
      updateHealthBars();
      timerEl.textContent = '60';
      fighter1.classList.remove('attack', 'hit', 'blocking', 'jump');
      fighter2.classList.remove('attack', 'hit', 'blocking', 'jump');
      showMessage('KÖZEL A CSATA!', 1200);
      startGameLoop();
    }

    function endRound(msg) {
      state.roundOver = true;
      state.started = false;
      clearInterval(state.gameLoop);
      showMessage(msg, 1800);
    }

    function tickTimer() {
      state.timeLeft -= 1;
      timerEl.textContent = String(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 0) {
        if (state.p1Health > state.p2Health) {
          endRound('Ladybug győzött!');
        } else if (state.p2Health > state.p1Health) {
          endRound('Anakondra nyert!');
        } else {
          endRound('Döntetlen!');
        }
      }
    }

    function startGameLoop() {
      clearInterval(state.gameLoop);
      state.gameLoop = setInterval(() => {
        if (state.started && !state.roundOver) {
          tickTimer();
          handleEnemyAI();
        }
      }, 1000);
    }

    function handleEnemyAI() {
      const p1X = Number.parseFloat(fighter1.style.left || 0);
      const p2X = Number.parseFloat(fighter2.style.left || 0);
      if (Math.abs(p1X - p2X) < 120) {
        if (Math.random() < 0.04) {
          punch('p2', 'p1', 8 + Math.random() * 7);
        }
        if (Math.random() < 0.02) {
          doSpecial('p2');
        }
      }
    }

    function applyMomentumToPlayer(player, direction) {
      if (state.roundOver) return;
      const node = player === 'p1' ? fighter1 : fighter2;
      const current = Number.parseFloat(node.style.left || (player === 'p1' ? '170' : '760'));
      const next = clamp(current + direction * 18, player === 'p1' ? 60 : 560, player === 'p1' ? 420 : 980);
      node.style.left = next + 'px';
    }

    function inputLoop() {
      if (!state.started) return;

      if (state.keyState.a) applyMomentumToPlayer('p1', -1);
      if (state.keyState.d) applyMomentumToPlayer('p1', 1);
      if (state.keyState.w) {
        if (!fighter1.classList.contains('jump')) {
          fighter1.classList.add('jump');
          setTimeout(() => fighter1.classList.remove('jump'), 260);
        }
      }
      if (state.keyState.j) {
        if (state.attackCooldown <= 0) {
          state.attackCooldown = 280;
          punch('p1', 'p2', 10);
        }
      }
      if (state.keyState.k) {
        if (state.attackCooldown <= 0) {
          state.attackCooldown = 520;
          doSpecial('p1');
        }
      }
      if (state.keyState.l) {
        fighter1.classList.add('blocking');
      } else {
        fighter1.classList.remove('blocking');
      }

      const p1X = Number.parseFloat(fighter1.style.left || 170);
      const p2X = Number.parseFloat(fighter2.style.left || 760);
      const distance = Math.abs(p1X - p2X);
      if (distance < 120) {
        if (state.keyState.i) {
          if (state.enemyCooldown <= 0) {
            state.enemyCooldown = 500;
            punch('p2', 'p1', 8);
          }
        }
      }

      state.attackCooldown = Math.max(0, state.attackCooldown - 16);
      state.enemyCooldown = Math.max(0, state.enemyCooldown - 16);
      requestAnimationFrame(inputLoop);
    }

    function initializePositions() {
      fighter1.style.left = '170px';
      fighter1.style.bottom = '120px';
      fighter2.style.left = '760px';
      fighter2.style.bottom = '120px';
    }

    function makeAudio() {
      if (state.audio) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      state.audio = new AudioCtx();
      state.oscillator = state.audio.createOscillator();
      state.gainNode = state.audio.createGain();
      state.oscillator.type = 'sawtooth';
      state.oscillator.frequency.value = 140;
      state.gainNode.gain.value = 0.001;
      state.oscillator.connect(state.gainNode);
      state.gainNode.connect(state.audio.destination);
      state.oscillator.start();
    }

    function toggleMusic() {
      makeAudio();
      state.musicOn = !state.musicOn;
      if (state.musicOn) {
        state.oscillator.frequency.value = 160;
        state.gainNode.gain.value = 0.02;
        toggleMusicBtn.textContent = 'Zene: Be';
      } else {
        state.gainNode.gain.value = 0.001;
        toggleMusicBtn.textContent = 'Zene: Ki';
      }
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'a' || key === 'd' || key === 'w' || key === 's' || key === 'j' || key === 'k' || key === 'l' || key === 'i') {
        state.keyState[key] = true;
      }
      if (key === ' ' && !state.started) {
        event.preventDefault();
        startRound();
      }
    });

    window.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key in state.keyState) {
        state.keyState[key] = false;
      }
    });

    startBtn.addEventListener('click', () => {
      startRound();
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(state.gameLoop);
      state.started = false;
      state.roundOver = false;
      state.timeLeft = 60;
      state.p1Health = 100;
      state.p2Health = 100;
      timerEl.textContent = '60';
      initializePositions();
      updateHealthBars();
      showMessage('ÚJ KÖR', 700);
    });

    toggleMusicBtn.addEventListener('click', toggleMusic);

    initializePositions();
    updateHealthBars();
    showMessage('KLASSZIKUS CSATA', 1200);
    requestAnimationFrame(inputLoop);
  </script>
</body>
</html>
